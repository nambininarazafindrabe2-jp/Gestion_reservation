{% extends 'layout/index.html' %}
{% block content %}
<h2>Confirmer la suppression</h2>
<p>Voulez-vous retirer le trajet <strong>{{ contenu.destinations.destinations }}</strong> de la réservation N°<strong>{{ contenu.coder.coder }}</strong> ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer</button>
</form>
<a href="{% url 'contenir_list_name' %}">Annuler</a>
{% endblock %}
