{% extends 'layout/index.html' %}
{% block content %}
<h2>Confirmer la suppression</h2>
<p>Voulez-vous vraiment supprimer le client <strong>{{ client.nomc }} {{ client.prenomc }}</strong> ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer la suppression</button>
</form>
<a href="{% url 'client_list_name' %}">Annuler</a>
{% endblock %}
